<!DOCTYPE html>

<!-- These lines make it behave like an app when added to the Home Screen -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --ink: #16181d; --muted: #6b6f78; --line: #e3e1da;
    --accent: #c8952c; --accent-soft: #f6ecd6; --good: #2f8f5b; --good-soft: #e3f3ea;
    --must: #c8372d; --must-soft: #fdeeec;
    --next: #b98a00; --next-soft: #fff6d6;
    --trade: #2f6fdb; --trade-soft: #e6eefc;
    --learn: #2f8f5b; --learn-soft: #e3f3ea;
    --build: #7a4fd6; --build-soft: #efe9fb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #171a21; --ink: #eceae4; --muted: #9a9ea8; --line: #262a33;
      --accent: #e0b04a; --accent-soft: #2b2416; --good: #4fbf83; --good-soft: #15281e;
      --must: #ff6b5e; --must-soft: #2e1513;
      --next: #f2c94c; --next-soft: #2b2410;
      --trade: #6ea0ff; --trade-soft: #16223a;
      --learn: #4fbf83; --learn-soft: #15281e;
      --build: #b294ff; --build-soft: #231c38;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    padding: env(safe-area-inset-top) 0 0;
  }
  button { font: inherit; color: inherit; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px 16px calc(96px + env(safe-area-inset-bottom)); }
  .hidden { display: none !important; }

  /* Bottom navigation */
  .nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--card);
    border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, 1fr);
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
  }
  .nav button { background: none; border: none; padding: 8px 0; font-size: 13px; font-weight: 600; color: var(--muted); border-radius: 10px; cursor: pointer; }
  .nav button.on { color: var(--ink); background: var(--bg); }
  .nav button span { display: block; font-size: 18px; line-height: 1.1; }

  /* Headings */
  .hd { margin: 8px 0 16px; }
  .hd .sup { font-size: 13px; color: var(--muted); font-weight: 600; }
  .hd h1 { font-size: 28px; line-height: 1.15; margin: 2px 0 4px; letter-spacing: -0.02em; }
  .hd .sub { font-size: 14px; color: var(--muted); }
  h2.sec { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 24px 0 8px; display: flex; align-items: center; gap: 8px; }
  .back { background: none; border: none; font-size: 15px; font-weight: 600; padding: 6px 0; cursor: pointer; }
  .note { font-size: 13px; color: var(--muted); margin: 8px 0; }
  .bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; }

  /* Tags */
  .tag { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 1px 7px; border-radius: 99px; }
  .tag.trade { color: var(--trade); background: var(--trade-soft); }
  .tag.learn { color: var(--learn); background: var(--learn-soft); }
  .tag.build { color: var(--build); background: var(--build-soft); }
  .tag.cl { color: var(--accent); background: var(--accent-soft); }
  .tag.opt { color: var(--muted); background: var(--line); }

  /* A task row: tick on the left, tap the text for details */
  .it { display: grid; grid-template-columns: 34px 1fr; align-items: start; background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 6px; }
  .ck { display: grid; place-items: center; padding: 12px 0 0 10px; cursor: pointer; }
  .ck input { display: none; }
  .box { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--muted); display: grid; place-items: center; transition: .15s; }
  .ck input:checked + .box { background: var(--good); border-color: var(--good); }
  .ck input:checked + .box::after { content: ""; width: 6px; height: 11px; border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: rotate(45deg) translate(-1px,-1px); }
  .it-main { text-align: left; background: none; border: none; padding: 11px 12px 11px 6px; cursor: pointer; min-width: 0; }
  .it-t { display: block; font-weight: 600; font-size: 15px; line-height: 1.35; }
  .it-tags { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 4px; }
  .it-min { font-size: 12px; color: var(--muted); }
  .it-carry { font-size: 11px; font-weight: 700; color: var(--accent); }
  .it-more { font-size: 12px; color: var(--muted); margin-left: auto; }
  .it-d { display: none; grid-column: 2; font-size: 14px; color: var(--muted); padding: 0 12px 12px 6px; line-height: 1.5; }
  .it.open .it-d { display: block; }
  .it.open .it-more { visibility: hidden; }
  .it.done .it-t { text-decoration: line-through; color: var(--muted); }

  /* Today: the red and yellow cards */
  .now-line { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .now-line b { color: var(--ink); }
  .strip { display: block; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 18px; cursor: pointer; }
  .strip .row { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--muted); }
  .strip b { color: var(--ink); }
  .strip .bar { margin: 8px 0 6px; }
  .big { border-radius: 16px; margin-bottom: 10px; border-width: 2px; }
  .big .it-t { font-size: 17px; }
  .big .ck { padding-top: 15px; }
  .big .it-main { padding-top: 13px; padding-bottom: 13px; }
  .big.red { border-color: var(--must); background: var(--must-soft); }
  .big.red .box { border-color: var(--must); }
  .big.yel { border-color: var(--next); background: var(--next-soft); }
  .big.yel .box { border-color: var(--next); }
  .big.done { border-color: var(--good); background: var(--good-soft); }
  .lbl { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 6px; }
  .lbl.red { color: var(--must); } .lbl.yel { color: var(--next); } .lbl.gray { color: var(--muted); margin-top: 20px; }
  .hard { font-size: 13px; color: var(--muted); margin: -2px 2px 4px; }
  .tv-total { font-size: 13px; color: var(--muted); margin: 4px 2px 0; }
  .btn { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-size: 15px; font-weight: 600; margin-top: 6px; cursor: pointer; }
  .btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .logrow { display: flex; gap: 8px; }
  .logrow input { flex: 1; min-width: 0; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-size: 16px; }
  .logrow button { padding: 0 16px; border-radius: 12px; border: none; background: var(--ink); color: var(--bg); font-weight: 600; cursor: pointer; }
  .up { display: flex; justify-content: space-between; gap: 10px; padding: 9px 2px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); }
  details.fold > summary { cursor: pointer; font-size: 14px; color: var(--muted); padding: 8px 0; list-style: none; }
  details.fold > summary::-webkit-details-marker { display: none; }
  details.fold > summary::before { content: "▸ "; } details.fold[open] > summary::before { content: "▾ "; }

  /* Stage cards */
  .sc { display: block; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer; }
  .sc.now { border: 2px solid var(--accent); }
  .sc.done { border-color: var(--good); }
  .sc-top { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .sc-top .n { color: var(--accent); text-transform: uppercase; letter-spacing: .06em; }
  .sc-t { font-size: 18px; font-weight: 700; margin: 2px 0; letter-spacing: -0.01em; }
  .sc-cap { font-size: 13.5px; color: var(--muted); margin-bottom: 10px; }
  .sc-c { font-size: 12.5px; color: var(--muted); margin-top: 6px; }

  /* Milestone (gate) rows */
  .gt { display: grid; grid-template-columns: 34px 1fr; background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 12px; margin-bottom: 6px; padding-bottom: 10px; }
  .gt.passed { background: var(--good-soft); border-color: var(--good); }
  .gt-b { padding: 10px 12px 0 6px; min-width: 0; }
  .gt-t { font-weight: 700; font-size: 15px; line-height: 1.35; }
  .gt-m { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .gt-r { font-size: 13px; margin-top: 4px; color: var(--accent); font-weight: 600; }
  .gt.passed .gt-r { color: var(--good); }
  .lnk { background: none; border: none; padding: 0; color: var(--accent); font-weight: 600; font-size: 13px; cursor: pointer; }

  /* Learn groups and build projects */
  .grp { font-size: 14px; font-weight: 700; margin: 14px 0 2px; }
  .grp-n { font-size: 13px; color: var(--muted); margin: 0 0 6px; }
  .pj { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 8px; overflow: hidden; }
  .pj.passed { border-color: var(--good); }
  .pj > summary { list-style: none; padding: 12px 14px; cursor: pointer; }
  .pj > summary::-webkit-details-marker { display: none; }
  .pj-top { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
  .pj-t { font-weight: 700; font-size: 15.5px; }
  .pj-m { font-size: 12.5px; color: var(--muted); margin: 2px 0 8px; }
  .pj-b { padding: 0 10px 10px; }
  .pj-i { font-size: 14px; color: var(--muted); margin: 0 4px 10px; }
  .pj .it { background: var(--bg); }
  .info { font-size: 13.5px; color: var(--muted); margin: 6px 4px 8px; }
  .info b { color: var(--ink); }
  details.stuck > summary { list-style: none; cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--muted); padding: 8px 4px; }
  details.stuck > summary::-webkit-details-marker { display: none; }
  details.stuck > summary::before { content: "▸ "; } details.stuck[open] > summary::before { content: "▾ "; }

  /* Rewards and levels */
  .lv .row { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; font-size: 14px; }
  .lv .row b { color: var(--accent); }
  .lv .bar { margin: 6px 0 4px; }
  .lv .sub { font-size: 12.5px; color: var(--muted); margin-bottom: 10px; }
  .xp { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
  .rw { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 8px; }
  .rw.unlocked { border-color: var(--good); background: var(--good-soft); }
  .rw-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .rw-top b { font-size: 15px; }
  .pill { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; white-space: nowrap; background: var(--line); color: var(--muted); }
  .pill.on { background: var(--good); color: #fff; } .pill.gold { background: var(--accent); color: #fff; }
  .rw .m { font-size: 12.5px; color: var(--muted); margin: 2px 0 6px; }
  .rw label { display: block; font-size: 12.5px; color: var(--muted); margin-top: 6px; }
  .rw input { display: block; width: 100%; margin-top: 3px; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-size: 16px; }

  /* More */
  .menu { display: block; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 8px; cursor: pointer; }
  .menu b { display: block; font-size: 15.5px; }
  .menu span { font-size: 13px; color: var(--muted); }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .tools button { padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-size: 14px; cursor: pointer; }
  .plain ul, .plain ol { margin: 0; padding-left: 20px; }
  .plain li { margin: 7px 0; font-size: 14.5px; }
  .plain h3 { font-size: 15px; margin: 18px 0 4px; }
  .plain .muted li { color: var(--muted); font-size: 14px; margin: 4px 0; }
  .slot { display: grid; grid-template-columns: 118px 1fr; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .slot .tm { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .slot.now { background: var(--accent-soft); margin: 0 -16px; padding: 9px 16px; }
  .logitem { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .logitem .d { flex: none; min-width: 48px; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .logitem .x { margin-left: auto; flex: none; border: none; background: none; color: var(--muted); font-size: 20px; line-height: 1; padding: 0 4px; cursor: pointer; }

  .toast {
    position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 40;
    background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; max-width: 90vw;
    opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 50; }
  .confetti i { position: absolute; top: -12px; width: 8px; height: 12px; border-radius: 2px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
</style>
</head>

<script>
// =====================================================================
// 1. CONTENT
// Each task: [permanent id, title, details, kind, minutes?]. Ids never change, so your ticks stay saved.
// Kinds: trade, build, do, claude (build lane) · lesson, code, book, video, course, read, unit (learn lane)
// =====================================================================

// ---------- Trading tasks (one-offs; daily trading is added on its own) ----------
const TRADE_ITEMS = [
  ["t1a", "Write FTMO's rules on one card", "Daily loss limit, max loss, profit targets, minimum trading days, news and weekend rules. Copy them from FTMO's own site so they're current, and keep the card at your desk.", "trade", 30],
  ["t1b", "Risk-of-ruin maths for the challenge", "With your win rate and average R, what risk per trade keeps the chance of hitting max loss small? Have Claude simulate it, then check one case by hand.", "trade", 60],
  ["t1c", "Set your challenge risk per trade", "Pick one of your lot-size presets and write it into your plan. No changing it mid-challenge.", "trade", 20],
  ["t1e", "Start the FTMO challenge", "50K or 100K. Same plan, same risk, every day.", "trade", 20],
  ["fa1", "Open your personal brokerage account", "In your own name, with money you can afford, at a broker with clean, verifiable statements. This is your track record: prop accounts don't count as one. Add prop payouts to it as you withdraw them. Get professional advice on the setup.", "trade", 60],
  ["t1f", "Connect it to Myfxbook from day one", "A third-party verifier, so the record is verified from the very first trade. Investors look at Sharpe ratio and max drawdown, not just returns.", "trade", 20],
  ["t2a", "Write your payout rule", "What share of every payout goes into your personal account. Decide it once so you never debate it.", "trade", 20],
  ["t2b", "Write down FTMO's scaling plan", "Exactly what each scale-up needs (profit over the period, payouts) and when you can next qualify. Track it.", "trade", 30],
  ["t2d", "Set a max drawdown for your personal account", "Investors judge drawdowns as closely as returns. Keep leverage modest so the curve stays steady.", "trade", 20],
  ["t3a", "Re-check FTMO's and Lux's rules on EAs, bots and copy trading", "Before you automate anything. Some firms restrict them. Write down exactly what's allowed for each account.", "trade", 30],
  ["t3b", "Read Lux's rules and scaling table", "Evaluation target (about 15% on the $1M account), drawdown limits, and how each 10% scale-up works. Check their site for the current numbers.", "trade", 30],
  ["t3c", "Start the Lux $1M evaluation", "No time limit, so wait for your best setups. Rushing the 15% is how evaluations fail.", "trade", 20],
  ["t4a", "Track every Lux scale-up in a sheet", "Date reached, balance, drawdown on the way. Steady beats fast: one breach ends the climb.", "trade", 30],
  ["t4b", "Keep scaling FTMO alongside", "Same rules, same risk. Its scale-ups come on a schedule, so just keep qualifying.", "trade", 20],
  ["t5a", "Pull your verified record", "Myfxbook plus broker statements for the whole period. The documents investors and auditors will ask for.", "trade", 60],
];

// ---------- Build projects (your old milestones, now inside the stages) ----------
const PROJECTS = [
  { id: "m1", title: "Set up and start the clock", target: "2026-11-15",

function priorityList() {

function toast(msg, ms) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove("show"), ms || 1800);
}
function confetti() {
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const box = document.createElement("div"); box.className = "confetti";
  const colors = ["#e0b04a", "#4fbf83", "#e46b5a", "#5b8def", "#c8952c"];
  for (let i = 0; i < 80; i++) {
    const p = document.createElement("i");
    p.style.left = Math.random() * 100 + "%"; p.style.background = colors[i % colors.length];
    p.style.animationDuration = (1.6 + Math.random()) + "s"; p.style.animationDelay = (Math.random() * 0.3) + "s";
    box.appendChild(p);
  }
  document.body.appendChild(box); setTimeout(() => box.remove(), 3200);
}

document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.daily) {
    const d = today(), k = el.dataset.daily;
    state._daily[d] = state._daily[d] || {}; state._daily[d][k] = el.checked;
    save();
    if (el.checked && state._t && state._t.red === k) toast("Must-do done. That's a step forward.", 2500);
    render(); return;
  }
  const id = el.dataset.id; if (!id) return;
  const before = levelOf(totalXP());
  state[id] = el.checked;
  const ms = MS_BY_GATE[id];
  if (ms) { if (el.checked) state._passed[id] = today(); else delete state._passed[id]; }
  save();
  if (ms && el.checked) {
    const ed = earlyDays(ms), r = state._rewards[ms.key] || {};
    let msg = `Milestone passed${ed > 0 ? ` ${plural(ed, "day")} early! +${50 + speedBonus(ms)} XP` : "! +50 XP"}`;
    if (r.r) msg += ` · Unlocked: ${r.r}`;
    if (ed >= 0 && r.b) msg += ` + ${r.b}`;
    confetti(); toast(msg, 4000);
  } else if (el.checked && state._t && (state._t.red === id || state._t.yellow === id)) {
    toast(state._t.red === id ? "Must-do done. That's a step forward." : "Second priority done.", 2500);
  }
  const after = levelOf(totalXP());
  if (after > before) setTimeout(() => { confetti(); toast(`Level up! You're now a ${LEVELS[after][1]}`, 3500); }, ms && el.checked ? 4200 : 0);
  render();
});

document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.open) { const k = t.dataset.open; OPEN.has(k) ? OPEN.delete(k) : OPEN.add(k); t.closest(".it").classList.toggle("open"); return; }
  if (t.dataset.nav) return go(t.dataset.nav);
  if (t.dataset.stage) return go("stage:" + t.dataset.stage);
  if (t.dataset.sub) return go("sub:" + t.dataset.sub);
  if (t.dataset.pull) {
    const p = state._t, next = learnList().find(id => !p.learn.includes(id) && id !== p.red && id !== p.yellow)
      || priorityList().find(id => !p.learn.includes(id) && id !== p.red && id !== p.yellow);
    if (next) { p.learn.push(next); save(); render(); }
    return;
  }
  if (t.dataset.log) {
    const input = $(t.dataset.log), txt = input.value.trim();
    if (!txt) { input.focus(); return; }
    state._log.push({ d: today(), t: txt }); save(); render(); toast("Logged"); return;
  }
  if (t.dataset.del !== undefined) {
    if (!confirm("Delete this log entry?")) return;
    state._log.splice(+t.dataset.del, 1); save(); render(); return;
  }
  if (t.id === "exportBtn") {
    const code = btoa(unescape(encodeURIComponent(JSON.stringify(state))));
    (navigator.clipboard ? navigator.clipboard.writeText(code) : Promise.reject()).then(() => toast("Progress code copied"), () => prompt("Copy this progress code:", code));
    return;
  }
  if (t.id === "importBtn") {
    const code = prompt("Paste your progress code:"); if (!code) return;
    try {
      const text = decodeURIComponent(escape(atob(code.trim())));
      if (text.startsWith("{")) state = JSON.parse(text);
      else { state = {}; text.split(",").filter(Boolean).forEach(id => state[id] = true); } // older codes held only ticked ids
      fixState(); delete state._t; state._view = "today"; save(); render(); toast("Progress loaded");
    } catch (err) { toast("That code didn't work"); }
    return;
  }
  if (t.id === "resetBtn") {
    if (confirm("Untick everything, clear rewards and clear your session log?")) { state = {}; fixState(); save(); go("today"); }
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.target.id === "tvLog" || e.target.id === "logText")) document.querySelector(`[data-log="${e.target.id}"]`).click();
});
document.addEventListener("input", e => {
  const k = e.target.dataset.reward; if (!k) return;
  state._rewards[k] = state._rewards[k] || {};
  state._rewards[k][e.target.dataset.field] = e.target.value.trim();

});
document.addEventListener("toggle", e => {

  const set = new Set(state._openProj); e.target.open ? set.add(p) : set.delete(p);
  state._openProj = [...set]; save();
}, true);

// Auto-update: when the app opens or comes back to the front, check for a newer version and load it.
const APP_VERSION = "2026-10-22a";
async function checkForUpdate() {
  try {
    const r = await fetch("index.html?check=" + Date.now(), { cache: "no-store" });
    const m = (await r.text()).match(/const APP_VERSION = "([^"]+)"/);
    if (m && m[1] !== APP_VERSION) location.replace("index.html?v=" + m[1]);
  } catch (e) {}
}
checkForUpdate();
document.addEventListener("visibilitychange", () => { if (!document.hidden) { checkForUpdate(); render(); } });

state._view = "today";
render();
</script>
